# Builds Rewind on Windows, tests it and packs an installer and a portable zip.
#  - every push / pull request: tests + packages as downloadable artifacts
#  - a tag like v0.2.0: the same, published as a GitHub Release
#
# Code signing (optional): add repository secrets SIGN_CERT_PFX (the .pfx
# file, base64) and SIGN_CERT_PASSWORD; the .exe and the installer are then
# signed. Without them everything is built unsigned.
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # creating releases on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Unit tests
        working-directory: app
        run: cargo test --locked

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = (Select-String -Path app/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tag matches the program version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $cargo = (Select-String -Path app/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($cargo -ne "${{ steps.ver.outputs.version }}") {
            throw "Tag ${{ github.ref_name }} does not match app/Cargo.toml version $cargo — the update check compares them. Bump Cargo.toml first."
          }

      - name: Signing certificate
        id: sign
        shell: pwsh
        env:
          PFX: ${{ secrets.SIGN_CERT_PFX }}
        run: |
          if ($env:PFX) {
            $path = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
            "pfx=$path" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No SIGN_CERT_PFX secret: building unsigned."
          }

      - name: Build and package
        shell: pwsh
        env:
          SIGN_PFX: ${{ steps.sign.outputs.pfx }}
          SIGN_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: ./scripts/package.ps1 -Version "${{ steps.ver.outputs.version }}" -RequireInstaller

      # The build machines have no screen, sound card or video encoder, so a
      # real recording can't run here; check that the program starts and
      # draws its window and notice.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "app/target/release/rewind.exe"
          $ui = & $exe --render | Out-String
          if ($ui -notmatch "REWIND") { throw "UI did not render:`n$ui" }
          & $exe --toast-png "$env:RUNNER_TEMP/toast.png"
          if (-not (Test-Path "$env:RUNNER_TEMP/toast.png")) { throw "notice was not drawn" }
          Write-Host "ok"

      - uses: actions/upload-artifact@v7
        with:
          name: Rewind-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
